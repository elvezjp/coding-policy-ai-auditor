[project]
name = "coding-policy-ai-auditor-backend"
version = "0.6.0"
description = "コーディング規約-Javaプログラム AIオーディター バックエンド"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "boto3>=1.35.0",
    "markitdown[xlsx]>=0.0.1a3",
    "openpyxl>=3.1.5",
    "anthropic>=0.40.0",
    "openai>=2.14.0",
    "python-dotenv>=1.0.0",
    "add-line-numbers>=0.1.3",
    "excel2md>=2.2.1",
    "pylint>=4.0.9",
]

[project.optional-dependencies]
ruff = ["ruff>=0.1.0"]
flake8 = ["flake8>=6.0.0"]

[tool.uv.sources]
add-line-numbers = { git = "https://github.com/elvezjp/add-line-numbers.git", tag = "v0.1.3" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
# Security: raise the floor of the transitive dependencies `certifi` and `urllib3`.
#   - certifi < 2026.10.18 bundles emSign root CAs whose intermediate CA keys
#     were compromised (GHSA-6q48-6c7w-9gw2)
#   - urllib3 < 2.8.0 buffers an unbounded chunk-size line into memory
#     (GHSA-vxq7-64xx-v4gw) and can loop forever on chunked deflate streams
#     (GHSA-gh4c-6fx4-qh6g)
constraint-dependencies = [
    "certifi>=2026.10.18",
    "urllib3>=2.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
